<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>XBOST — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5/index.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/@fontsource/geist-mono@5/index.css" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body{background:#07070c;color:#ececf1;font-family:'Geist Sans',Inter,system-ui,sans-serif;
    background-image:radial-gradient(900px 320px at 50% -120px, rgba(52,211,153,.12), transparent 70%);background-attachment:fixed}
  .card{background:linear-gradient(180deg,#141419,#0e0e13);border:1px solid #232329;border-radius:16px;
    box-shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 24px 64px -24px rgba(0,0,0,.9)}
  input{background:#17171d!important;border:1px solid #2e2e36!important;color:#ececf1!important;border-radius:10px;padding:11px 13px;width:100%;font-size:14px;transition:border-color .15s, box-shadow .15s}
  input:focus{border-color:#34d399!important;outline:none;box-shadow:0 0 0 3px rgba(52,211,153,.15)}
  .btn{background:linear-gradient(135deg,#34d399,#22ff88);color:#03251a;font-weight:800;border-radius:10px;padding:11px;font-size:14px;width:100%;transition:.15s;
    box-shadow:0 8px 24px -8px rgba(52,211,153,.55), 0 1px 0 rgba(255,255,255,.25) inset;border:1px solid rgba(255,255,255,.12)}
  .btn:hover{filter:brightness(1.08)}
  .logo{background:linear-gradient(135deg,#6ee7b7,#34d399 45%,#059669);box-shadow:0 6px 20px -6px rgba(52,211,153,.6), 0 1px 0 rgba(255,255,255,.3) inset}
  .font-disp{font-family:'Space Grotesk',Inter,sans-serif}
  .grad-text{background:linear-gradient(90deg,#fff,#a7f3d0);-webkit-background-clip:text;background-clip:text;color:transparent}
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <div class="card p-8 w-full max-w-sm">
    <div class="flex items-center gap-3 mb-1">
      <div class="logo w-11 h-11 rounded-xl flex items-center justify-center font-black text-zinc-950 text-xl font-disp">X</div>
      <div>
        <div class="font-disp font-bold tracking-tight text-[17px] grad-text">XBOST // QUANT TERMINAL</div>
        <div class="text-[10px] text-zinc-500 tracking-[.18em] uppercase">Restricted · login required</div>
      </div>
    </div>
    <form id="f" class="space-y-3 mt-6">
      <div><label class="text-[11px] uppercase tracking-widest text-zinc-400">Username</label><input id="u" autocomplete="username" class="mt-1"/></div>
      <div><label class="text-[11px] uppercase tracking-widest text-zinc-400">Password</label><input id="p" type="password" autocomplete="current-password" class="mt-1"/></div>
      <div id="err" class="hidden text-[13px] text-red-400 bg-red-950/40 border border-red-900 rounded-md px-3 py-2"></div>
      <button class="btn" type="submit">Sign in →</button>
    </form>
    <div class="text-[11px] text-zinc-600 mt-4 text-center">Contact your admin for an account.</div>
  </div>
<script>
document.getElementById('f').onsubmit = async (e) => {
  e.preventDefault();
  const err = document.getElementById('err');
  err.classList.add('hidden');
  const r = await fetch('/api/login', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ username: document.getElementById('u').value, password: document.getElementById('p').value })
  });
  const j = await r.json().catch(() => ({}));
  if (r.ok && j.ok) location.href = '/';
  else { err.textContent = j.error || ('Login failed (HTTP ' + r.status + ')'); err.classList.remove('hidden'); }
};
</script>
</body>
</html>
